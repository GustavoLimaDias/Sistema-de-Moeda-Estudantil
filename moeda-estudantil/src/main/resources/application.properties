spring.application.name=moeda-estudantil
server.port=8080

# ---------- Banco padrão: H2 em arquivo (./data), sem instalação ----------
spring.datasource.url=jdbc:h2:file:./data/moedaestudantil;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- JPA / Hibernate (ORM) ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Sessão ----------
app.sessao.validade-horas=8

# ---------- Crédito semestral (1º de janeiro e 1º de julho, 00:05) ----------
app.credito.cron=0 5 0 1 1,7 *

# ---------- Email ----------
# Sem spring.mail.host os emails ficam registrados no banco (modo simulado) e aparecem
# na "Caixa de entrada" de cada usuário. Para enviar de verdade, configure o SMTP, ex.:
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=seu-email@gmail.com
# spring.mail.password=senha-de-app
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
app.email.remetente=Moeda Estudantil <nao-responda@moedaestudantil.com>
