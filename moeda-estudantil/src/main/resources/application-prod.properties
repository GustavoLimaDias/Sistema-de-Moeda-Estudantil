# Perfil de produção (Render). Ativado pelo Dockerfile: -Dspring.profiles.active=prod
server.port=${PORT:8080}
# Render fica atrás de um proxy TLS: respeita X-Forwarded-Proto/Host
server.forward-headers-strategy=framework

# ---------- PostgreSQL ----------
# DB_URL no formato JDBC (jdbc:postgresql://host:5432/db). No Render o Dockerfile monta DB_URL a partir
# de DATABASE_URL (connectionString postgresql://user:pass@host/db, que não é JDBC); credenciais vão à parte.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Plano free do Render: poucas conexões e pouca memória
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# Origens extras do CORS (ex.: https://*.vercel.app), separadas por vírgula
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Emails continuam em modo simulado (sem spring.mail.host): o Render free bloqueia as portas SMTP
